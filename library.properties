name=SparkFun BMI330 Arduino Library
version=1.0.0
author=SparkFun Electronics <techsupport@sparkfun.com>
maintainer=SparkFun Electronics <sparkfun.com>
sentence=An Arduino library for the SparkFun Qwiic BMI330 breakout, built on the Bosch BMI330 6-DoF IMU.
paragraph=Drives the Bosch BMI330 accelerometer and gyroscope over I2C or SPI through the SparkFun Toolkit. Provides acceleration, angular rate, die temperature and sensor timestamps, full control of output data rate, range, bandwidth, hardware averaging and power modes, both interrupt pins with independent source routing, the 2 kB FIFO with watermark interrupts and frame decoding, and the on-chip feature engine - any-motion, no-motion, significant motion, tilt, orientation, flat, single/double/triple tap, step detector and step counter - plus axis remapping, self-test, gyroscope self-calibration and user offsets. Unlike the BMI270, the BMI330 needs no configuration file upload, so the library carries no vendor binary.
category=Sensors
url=https://github.com/sparkfun/SparkFun_BMI330_Arduino_Library
architectures=*
depends=SparkFun Toolkit (>=1.2.0)
includes=SparkFun_BMI330.h
